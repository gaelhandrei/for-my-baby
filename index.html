<!DOCTYPE html>
<html>

<head>

<title>Happy National Girlfriend Day ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Envelope -->

<div class="envelope" onclick="openLetter()">

    <div class="flap"></div>

    <div class="letter">

        <h3>For My Baby ❤️</h3>
        <p>Click me hihi 💌</p>

    </div>

</div>



<!-- Main Content -->

<div id="mainContent">


<div class="card">

<h1>Happy National Girlfriend Day ❤️</h1>

<h2>My Glorious Queen 👑</h2>

<p id="typing"></p>

</div>




<div class="card">

<h2>One Last Question 💍</h2>

<h3>
Will you keep loving me forever? ❤️
</h3>


<button onclick="yesAnswer()">
YES BABY ❤️
</button>


<button id="noBtn" onmouseover="moveNo()">
NO 😭
</button>



<p id="finalMessage">

🥹❤️ I knew you would say yes.

<br><br>

Thank you for choosing me, Baby.

I promise to keep loving you kekekeke.

</p>


</div>


</div>





<script src="script.js"></script>


</body>

</html>
